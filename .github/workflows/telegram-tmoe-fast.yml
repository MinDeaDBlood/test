name: Telegram TMoe fast compile

on:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/telegram-tmoe-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-13.2.2-tmoe-fast
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          ref: telegram-13.2.2-tmoe-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Clone sources
        shell: bash
        run: |
          git init telegram
          cd telegram
          git remote add origin https://github.com/TelegramMessenger/Telegram-Android.git
          git fetch --depth=1 origin 21f7d109da6ab3506c9e9577f98c6a38771ab335
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth=1
          cd ..
          git init tmoe
          cd tmoe
          git remote add origin https://github.com/cinit/TMoe.git
          git fetch --depth=1 origin 25043bcd95f0d58694c046d691c921915e763aac
          git checkout --detach FETCH_HEAD

      - name: Prepare embedded TMoe
        shell: bash
        env:
          TARGET_ABI: arm64-v8a
        run: bash telegram-tmoe/prepare.sh

      - name: Compile Java and Kotlin only
        shell: bash
        run: |
          cd telegram
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj:compileReleaseKotlin :TMessagesProj:compileReleaseJavaWithJavac
