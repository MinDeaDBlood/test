name: Fetch LSPatch CLI

on:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/fetch-lspatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: telegram-13.2.2-tmoe-build
      - name: Download JingMatrix LSPatch 0.8 CLI
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o lspatch-v0.8.jar \
            https://github.com/LSPosed/LSPatch/releases/download/v0.6/lspatch-v0.8.jar
          sha256sum lspatch-v0.8.jar
      - name: Upload LSPatch CLI
        uses: actions/upload-artifact@v4
        with:
          name: JingMatrix-LSPatch-v0.8-CLI
          path: lspatch-v0.8.jar
