name: Telegram 13.3.1 R8 mapping

on:
  workflow_dispatch:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/telegram-1331-mapping.yml"

permissions:
  contents: read

jobs:
  mapping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: telegram-13.2.2-tmoe-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Clone exact Telegram 13.3.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git init telegram
          cd telegram
          git remote add origin https://github.com/TelegramMessenger/Telegram-Android.git
          git fetch --depth=1 origin 14de6e0c4bfeab46c761d20b1775de23ab16a1b2
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth=1
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > local.properties

      - name: Generate standalone R8 mapping
        shell: bash
        run: |
          set -euxo pipefail
          cd telegram
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:minifyAfatStandaloneWithR8
          find TMessagesProj_AppStandalone/build/outputs/mapping -type f -maxdepth 4 -print || true
          MAP="$(find TMessagesProj_AppStandalone/build/outputs/mapping -type f -name mapping.txt | head -n 1)"
          test -n "$MAP"
          cp "$MAP" ../mapping.txt
          grep -E '^org\.telegram\.(ui\.ActionBar\.BaseFragment|ui\.ChatActivity|messenger\.MessageObject|messenger\.MessagesController|messenger\.LocaleController|messenger\.UserConfig|messenger\.SharedConfig|messenger\.DownloadController|messenger\.FileLoadOperation|messenger\.FileUploadOperation|ui\.ActionBar\.Theme) -> ' ../mapping.txt | tee ../anchor-map.txt || true

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-13.3.1-R8-mapping
          path: |
            mapping.txt
            anchor-map.txt
          if-no-files-found: error
          retention-days: 30
