name: Build localization test release

on:
  push:
    branches:
      - dt_prerel_localization_ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Check out localization test branch
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/Setup-MSBuild@v2

      - name: Prepare NuGet packages
        shell: pwsh
        run: .\nugetpkgprep.bat

      - name: Build with the upstream command
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts" -Force | Out-Null
          $ghAction = "yes"
          $solutionDir = "$((Get-Location).Path)\"
          $projectDir = "$((Get-Location).Path)\"
          $targetDir = (Get-Location).Path + "\bin\Debug\"
          iex "$($solutionDir)CheckMissingDlls.ps1"
          $logPath = Join-Path (Get-Location).Path "artifacts\msbuild.log"
          msbuild DISMTools.vbproj `
            /p:Configuration=Debug `
            /p:DeployOnBuild=true `
            /p:SolutionDir=$solutionDir `
            /p:ProjectDir=$projectDir `
            /p:TargetDir=$targetDir `
            /bl:artifacts\build.binlog `
            "/flp:logfile=$logPath;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Package successful build
        if: success()
        shell: pwsh
        run: |
          if (-not (Test-Path ".\bin\Debug\DISMTools.exe")) {
            throw "DISMTools.exe was not produced."
          }
          Compress-Archive -Path ".\bin\Debug\*" -DestinationPath ".\artifacts\DISMTools-portable.zip" -Force
          if (Test-Path ".\Installer\Output\dt_setup.exe") {
            Copy-Item ".\Installer\Output\dt_setup.exe" ".\artifacts\dt_setup.exe" -Force
          }

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-test-${{ github.run_number }}
          path: |
            artifacts\*
          if-no-files-found: warn

      - name: Publish test prerelease
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "localization-test-${{ github.run_number }}"
          $assets = Get-ChildItem ".\artifacts" -File |
            Where-Object { $_.Name -in @("DISMTools-portable.zip", "dt_setup.exe") } |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -eq 0) {
            throw "No downloadable application assets were produced."
          }
          gh release create $tag $assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "DISMTools localization test ${{ github.run_number }}" `
            --notes "Automated test build of the clean localization branch based on CodingWonders/DISMTools dt_prerel_2681." `
            --prerelease
