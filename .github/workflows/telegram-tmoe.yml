name: Telegram 13.2.2 + TMoe

on:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/telegram-tmoe.yml"
      - "telegram-tmoe/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            label: ARMv7
            artifact: Telegram-13.2.2-TMoe-ARMv7
          - abi: arm64-v8a
            label: ARMv8
            artifact: Telegram-13.2.2-TMoe-ARMv8

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          ref: telegram-13.2.2-tmoe-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Clone Telegram 13.2.2 and TMoe
        shell: bash
        run: |
          git clone https://github.com/TelegramMessenger/Telegram-Android.git telegram
          cd telegram
          git checkout 21f7d109da6ab3506c9e9577f98c6a38771ab335
          git submodule update --init --recursive --depth=1
          cd ..
          git clone https://github.com/cinit/TMoe.git tmoe
          cd tmoe
          git checkout 25043bcd95f0d58694c046d691c921915e763aac

      - name: Prepare embedded TMoe
        shell: bash
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          bash telegram-tmoe/prepare.sh

      - name: Build Telegram
        shell: bash
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          cd telegram
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease
          APK="$(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p ../out
          cp "$APK" "../out/${{ matrix.artifact }}.apk"
          sha256sum "../out/${{ matrix.artifact }}.apk" | tee "../out/${{ matrix.artifact }}.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/${{ matrix.artifact }}.apk
            out/${{ matrix.artifact }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
