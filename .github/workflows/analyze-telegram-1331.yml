name: Analyze Telegram 13.3.1 runtime classes

on:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/analyze-telegram-1331.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: telegram-13.2.2-tmoe-build

      - name: Download current Telegram APK
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o Telegram.apk https://telegram.org/dl/android/apk
          sha256sum Telegram.apk | tee out-sha256.txt
          ls -lh Telegram.apk

      - name: Download JADX
        shell: bash
        run: |
          curl -L --fail --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          echo "1755e4242ade71a077438723689f404079592ec7764a3a0572f98fef94ebcbf3  jadx.zip" | sha256sum -c -
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile Telegram 13.3.1 compatibility anchors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp out-sha256.txt out/telegram-apk.sha256

          declare -A CLASSES=(
            [ApplicationLoaderImpl]='org.telegram.messenger.ApplicationLoaderImpl'
            [FileLoadOperation]='org.telegram.messenger.d7'
            [FileUploadOperation]='org.telegram.messenger.o8'
            [DownloadController]='org.telegram.messenger.r5'
            [SharedConfig]='org.telegram.messenger.rz'
            [LocaleController]='org.telegram.messenger.dd'
            [MessageObject]='org.telegram.messenger.fj'
            [UserConfig]='org.telegram.messenger.a20'
            [MessagesController]='org.telegram.messenger.pp'
            [MessagesStorage]='org.telegram.messenger.as'
            [NotificationsController]='org.telegram.messenger.ft'
            [NotificationCenter]='org.telegram.messenger.ss'
            [BaseFragment]='org.telegram.ui.ActionBar.j2'
            [Theme]='org.telegram.ui.ActionBar.z4'
            [ChatActivity]='org.telegram.ui.on'
            [DialogsActivity]='org.telegram.ui.qx'
            [SettingsActivity]='org.telegram.ui.y41'
            [ChatMessageCell]='org.telegram.ui.Cells.q1'
            [ChatActivityEnterView]='org.telegram.ui.Components.ChatActivityEnterView'
            [StoriesControllerCandidate]='bh.b9'
            [StoriesControllerLogCandidate]='bh.r7'
          )

          for label in "${!CLASSES[@]}"; do
            clazz="${CLASSES[$label]}"
            echo "=== $label = $clazz ==="
            jadx/bin/jadx --log-level ERROR --single-class "$clazz" --single-class-output "out/$label.java" Telegram.apk || true
          done

          grep -nE "markStoryAsRead|hasStories|completeReadTask|premiumFeaturesBlocked|isPremium|hasPremiumOnAccounts|getCurrentUser|hasUnviewedDownloads|formatShortNumber|formatDateOnline|canBlurChat|canForwardMessage|isSecretMedia|isPremiumSticker|hasMediaSpoilers|updateParams|startUploadRequest|maybePlayVisibleVideo|logSponsoredClicked|selectReaction|createMenu|setCommand|isInVideoMode|hasRecordVideo|measureTime|removeDeletedMessagesFromNotifications|markMessagesAsDeleted|updateDialogsWithDeletedMessages|postNotificationName" out/*.java > out/focused-methods.txt || true

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-13.3.1-runtime-analysis
          path: out/
          if-no-files-found: error
          retention-days: 30
