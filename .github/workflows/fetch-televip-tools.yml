name: Fetch Android patching tools

on:
  push:
    branches:
      - telegram-13.3.1-televip-dev
    paths:
      - ".github/workflows/fetch-televip-tools.yml"
      - "televip-tools-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -L --fail --retry 3 -o out/lspatch-v1.2-487-release.jar https://github.com/JingMatrix/LSPatch/releases/download/v1.2/lspatch-v1.2-487-release.jar
          curl -L --fail --retry 3 -o out/apktool_3.0.3.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L --fail --retry 3 -o out/jadx-1.5.7.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          echo "d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165  out/lspatch-v1.2-487-release.jar" | sha256sum -c -
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  out/apktool_3.0.3.jar" | sha256sum -c -
          echo "1755e4242ade71a077438723689f404079592ec7764a3a0572f98fef94ebcbf3  out/jadx-1.5.7.zip" | sha256sum -c -
          java -jar out/lspatch-v1.2-487-release.jar --help > out/lspatch-help.txt
          java -jar out/apktool_3.0.3.jar --version > out/apktool-version.txt

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: televip-android-patching-tools
          path: out/
          if-no-files-found: error
          retention-days: 7
