name: Build TMoe module APK

on:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/build-tmoe-module.yml"
      - "telegram-tmoe/patch-tmoe-13.3.1-obfuscated-settings.py"
      - "telegram-tmoe/SettingEntryHook-13.3.1.java"
      - "telegram-tmoe/HostDexClassScanner.java"
      - "telegram-tmoe/NativeSettingsDialog.java"
      - "telegram-tmoe/Theme-13.3.1.java"
      - "telegram-tmoe/MainStartInit-13.3.1.java"
      - "telegram-tmoe/Telegram13Bootstrap.java"
      - "telegram-tmoe/HookEntry-13.3.1.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper workflow
        uses: actions/checkout@v5
        with:
          ref: telegram-13.2.2-tmoe-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone TMoe
        shell: bash
        run: |
          git init tmoe
          cd tmoe
          git remote add origin https://github.com/cinit/TMoe.git
          git fetch --depth=1 origin 25043bcd95f0d58694c046d691c921915e763aac
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth=1

      - name: Install Telegram 13.3.1 resilient TMoe integration
        shell: bash
        run: |
          set -euxo pipefail
          cp telegram-tmoe/SettingEntryHook-13.3.1.java tmoe/app/src/main/java/cc/ioctl/tmoe/hook/core/SettingEntryHook.java
          cp telegram-tmoe/HostDexClassScanner.java tmoe/app/src/main/java/cc/ioctl/tmoe/util/HostDexClassScanner.java
          cp telegram-tmoe/NativeSettingsDialog.java tmoe/app/src/main/java/cc/ioctl/tmoe/fragment/NativeSettingsDialog.java
          cp telegram-tmoe/Theme-13.3.1.java tmoe/app/src/main/java/cc/ioctl/tmoe/ui/Theme.java
          cp telegram-tmoe/MainStartInit-13.3.1.java tmoe/app/src/main/java/cc/ioctl/tmoe/base/MainStartInit.java
          cp telegram-tmoe/Telegram13Bootstrap.java tmoe/app/src/main/java/cc/ioctl/tmoe/startup/Telegram13Bootstrap.java
          cp telegram-tmoe/HookEntry-13.3.1.java tmoe/app/src/main/java/cc/ioctl/tmoe/startup/HookEntry.java

          grep -q 'HostDexClassScanner' tmoe/app/src/main/java/cc/ioctl/tmoe/hook/core/SettingEntryHook.java
          grep -q 'allClassesWithPrefix' tmoe/app/src/main/java/cc/ioctl/tmoe/util/HostDexClassScanner.java
          grep -q 'Telegram 13 Theme resolved by method shape' tmoe/app/src/main/java/cc/ioctl/tmoe/ui/Theme.java
          grep -q 'makeSectionRowBackground' tmoe/app/src/main/java/cc/ioctl/tmoe/fragment/NativeSettingsDialog.java
          grep -q 'proxy fragment unavailable' tmoe/app/src/main/java/cc/ioctl/tmoe/base/MainStartInit.java
          grep -q 'Telegram13Bootstrap.install' tmoe/app/src/main/java/cc/ioctl/tmoe/startup/HookEntry.java
          grep -q 'TMoe bootstrap' tmoe/app/src/main/java/cc/ioctl/tmoe/startup/Telegram13Bootstrap.java

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.31.1"
          echo "sdk.dir=$SDKROOT" > tmoe/local.properties

      - name: Build TMoe debug module
        shell: bash
        run: |
          cd tmoe
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload TMoe APK
        uses: actions/upload-artifact@v4
        with:
          name: TMoe-module-telegram-13.3.1-bootstrap-diag
          path: tmoe/app/build/outputs/apk/debug/*.apk
