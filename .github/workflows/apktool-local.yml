name: Apktool local reverse-engineering tool

on:
  workflow_dispatch:
  push:
    branches:
      - telegram-13.2.2-tmoe-build
    paths:
      - ".github/workflows/apktool-local.yml"

permissions:
  contents: read

jobs:
  tool:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Apktool 3.0.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2             -o apktool_3.0.3.jar             https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar" | sha256sum -c -
          java -jar apktool_3.0.3.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3-local
          path: apktool_3.0.3.jar
          retention-days: 7
